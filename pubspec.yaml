name: taheri_committee_app
description: Taheri Committee Community Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # Google Sign-In
  google_sign_in: ^6.2.1

  # State Management & Navigation
  get: ^4.6.6
  go_router: ^14.2.7

  # Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  visibility_detector: ^0.4.0+2
  flutter_animate: ^4.5.0

  # QR
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # OTP auto-fill (Android SMS Retriever; gracefully skipped on web/iOS)
  sms_autofill: ^2.4.0

  # Utils
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  rxdart: ^0.28.0
  confetti: ^0.7.0

  # Reports / export
  excel: ^4.0.6
  file_saver: ^0.2.14

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/home_page_right_side.png
    - assets/login-logo.png
    - assets/img1.jpg
    - assets/img2.jpg
    - assets/images/
